name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        awk: [mawk, gawk, busybox]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils gawk mawk busybox

      - name: Use ${{ matrix.awk }} as awk
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          if [ "${{ matrix.awk }}" = busybox ]; then
            printf '#!/bin/sh\nexec busybox awk "$@"\n' > "$RUNNER_TEMP/bin/awk"
            chmod +x "$RUNNER_TEMP/bin/awk"
          else
            ln -s "$(command -v ${{ matrix.awk }})" "$RUNNER_TEMP/bin/awk"
          fi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generated files are up to date
        run: |
          python3 src/build_installer.py
          python3 src/build_preview.py
          git diff --exit-code

      - name: Lint
        run: make check

      - name: Install test
        run: tests/install.sh
